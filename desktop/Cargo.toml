[package]
name = "vu-course-hub"
version = "1.0.0"
edition = "2024"
authors = ["1abdullahr1"]
license = "MIT"
description = "VU Course Hub Native Windows Desktop Application"

[dependencies]
gpui = { git = "https://github.com/sonorahq/gpui", package = "gpui" }
gpui_platform = { git = "https://github.com/sonorahq/gpui", package = "gpui_platform", features = ["font-kit"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
open = "5.3"
urlencoding = "2.1"
anyhow = "1.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
webview2-com = "0.39"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_Com",
  "Win32_System_LibraryLoader",
  "Win32_UI_Controls",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
windows-sys = { version = "0.61", features = [
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
