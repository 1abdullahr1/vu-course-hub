[package]
name = "vu-course-hub"
version = "1.0.0"
edition = "2021"
authors = ["1abdullahr1"]
license = "MIT"
description = "VU Course Hub Native Windows Desktop Application"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.8", features = ["shell-open"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
open = "5.3"
